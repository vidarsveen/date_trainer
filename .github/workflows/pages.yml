name: Deploy Daykeeper to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify calendar and quiz behavior
        run: node tests/calendar.cjs
      - name: Verify embedded audio and playback behavior
        run: node tests/audio.cjs
      - name: Verify offline caching
        run: node tests/offline.cjs
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest icon.svg sw.js _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
